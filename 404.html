<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>404 · Baizhi Chen</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; justify-content: center;
    background: #ffffff; color: #141414;
    font-family: "Noto Serif SC","Source Han Serif SC",Georgia,"Times New Roman",serif;
    padding: 0 24px; box-sizing: border-box; }
  @media (prefers-color-scheme: dark) {
    body { background: #0a0a0a; color: #f5f5f5; }
    .rule { background: #333 !important; }
    a { color: #f5f5f5 !important; }
  }
  .code { font-family: "JetBrains Mono",Consolas,monospace; font-size: 13px; letter-spacing: .3em; color: #757575; }
  h1 { font-size: 42px; line-height: 1.25; margin: 18px 0 10px; font-weight: 600; }
  p { font-size: 15px; line-height: 1.8; color: #757575; margin: 0 0 36px; max-width: 34em; }
  .rule { height: 1px; background: #e0e0e0; border: 0; margin: 0 0 28px; }
  a { color: #141414; text-decoration: none; font-size: 15px;
      border-bottom: 1px solid #141414; padding-bottom: 3px; }
  a:hover { opacity: .6; }
  .wrap { max-width: 680px; margin: 0 auto; width: 100%; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>这个页面不存在。</h1>
    <p>The page you are looking for does not exist — it may have been moved, or the address may be off by a letter. 内容都在首页与文章里。</p>
    <hr class="rule" />
    <a href="/">← 回到首页 / Back home</a>
  </div>
</body>
</html>
